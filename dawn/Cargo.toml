[package]
name = "dawn"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "DNS Anti-censorship WebAssembly Nexus - A DNS proxy with pluggable WASM transforms"
readme = "../README.md"

[lib]
name = "dawn"
path = "src/lib.rs"

[[bin]]
name = "dawn"
path = "src/main.rs"

[[bin]]
name = "dawn-tester"
path = "src/bin/dawn_tester.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
wasmtime = "41"
clap = { version = "4", features = ["derive"] }
hickory-resolver = "0.24"
hickory-proto = "0.24"
colored = "3"
rand = "0.8"

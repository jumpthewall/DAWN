name: CI

on:
  push:
    paths:
      - 'dawn/**'
      - 'plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'dawn/**'
      - 'plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v16
        with:
          name: nix-community
          skipPush: true

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Run clippy
        run: nix develop --command cargo clippy -- -D warnings

      - name: Build dawn
        run: nix develop --command cargo build --release

      - name: Run tests
        run: nix develop --command cargo test

      - name: Build WASM plugins
        run: |
          nix develop --command cargo build -p dawn_doubler --target wasm32-unknown-unknown --release
          nix develop --command cargo build -p dawn_iquery --target wasm32-unknown-unknown --release

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v16
        with:
          name: nix-community
          skipPush: true

      - name: Build dawn package
        run: nix build .#dawn

      - name: Build doubler plugin
        run: nix build .#doublerPlugin

      - name: Build iquery plugin
        run: nix build .#iqueryPlugin
